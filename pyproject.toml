[project]
name = "bpoe-events-db-handler"
version = "0.1.0"
description = "Database handler microservice for the BPOE ecosystem — manages PostgreSQL (TimescaleDB) and MongoDB."
authors = [{ name = "aleksander.marszalkiewicz" }]
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "fastapi>=0.136.3",
    "pendulum>=3.2.0",
    "psycopg[binary]>=3.3.4",
    "pydantic[email]>=2.13.4",
    "pymongo>=4.17.0",
    "python-decouple>=3.8",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "codespell>=2.4.2",
    "commitizen>=4.16.3",
    "httpx>=0.28.1",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.17",
    "testcontainers>=4.14.2",
    "ty==0.0.49",
]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
addopts = ["--junitxml=./result/pytest_result.xml", "--cov=src", "--cov-report=html:result/html"]
asyncio_mode = "auto"
markers = [
    "unit: fast isolated unit tests (no external services)",
    "integration: tests that require external services — run with -m integration",
    "regression: regression tests for known bugs",
]
filterwarnings = [
    "ignore::UserWarning",
    'ignore:function ham\(\) is deprecated:DeprecationWarning',
    "ignore:module 'sre_constants' is deprecated:DeprecationWarning",
    "ignore::SyntaxWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince20",
    "ignore:'asyncio.*' is deprecated:DeprecationWarning:pytest_asyncio",
    "ignore:'asyncio.*' is deprecated:DeprecationWarning:fastapi",
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
]

[tool.coverage.run]
data_file = "result/.coverage"

[tool.ruff]
extend-exclude = []
line-length = 124
exclude = ["src/core/relationaldb/migration_alembic/migrations/versions/*", "tests/*"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 124

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F401", "F841"]
"test_*.py" = ["F401", "F841"]
"src/core/relationaldb/migration_alembic/migrations/env.py" = ["SIM103", "F401", "SIM10"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.params.Depends", "fastapi.Query", "fastapi.params.Query"]

[tool.ty.environment]
extra-paths = ["src"]

[tool.ty.src]
exclude = ["tests/*"]

[tool.codespell]
skip = "./.git,./.github,./tests,./log,./result"
builtin = "clear"
quiet-level = 3

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
]
change_type_order = ["feat", "fix", "hotfix", "chore", "docs", "refactor", "test"]

schema_pattern = "(build|chore|ci|docs|feature|feat|fix|hotfix|perf|refactor|style|test|config)(\\(.+\\))?!?: .+"

[tool.commitizen.schema_mapping]
feature = "feat"
hotfix = "fix"
config = "chore"

[[tool.commitizen.customize.questions]]
type = "list"
name = "type"
message = "Prefix?"
choices = [
    { value = "feat", name = "feature" },
    { value = "fix", name = "hotfix" },
    { value = "chore", name = "config" },
    { value = "refactor", name = "refactor" },
    { value = "docs", name = "docs" },
    { value = "test", name = "tests" },
    { value = "chore", name = "chore/other" },
]

[tool.commitizen.change_type_map]
feat = "Features"
fix = "Bug Fixes"
hotfix = "Hotfixes"
chore = "Chores"
docs = "Documentation"
refactor = "Refactors"
test = "Tests"
